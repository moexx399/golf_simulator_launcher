# Builds the launcher as a self-contained folder (Qt bundled) for macOS (Apple
# Silicon and Intel) and Linux.
#   - every push / pull request: build + smoke test on each platform, each archive
#     uploaded as a workflow artifact
#   - version tags (v1.2.3): also published together as one GitHub Release, with
#     notes from changie (.changes/v1.2.3.md), then to the Homebrew tap
# A folder rather than --onefile: that would unpack all of Qt on every launch, and
# this starts at login.
name: build-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x64 }
          # the oldest supported Ubuntu: a binary built against an older glibc
          # also runs on newer distributions, not the other way round
          - { os: ubuntu-22.04, platform: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          code=$(python launcher.py --version)
          if [ "$GITHUB_REF_NAME" != "v$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $code (run 'changie batch' first)"; exit 1
          fi
          [ -f ".changes/$GITHUB_REF_NAME.md" ] || { echo "::error::missing .changes/$GITHUB_REF_NAME.md (run 'changie batch')"; exit 1; }

      - name: Install the libraries Qt needs
        if: runner.os == 'Linux'
        # PyInstaller bundles what Qt links to, but only what's on this machine.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libglib2.0-0 libbrotli1 libfontconfig1 libfreetype6 \
            libwayland-client0 libwayland-cursor0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          pyinstaller --noconfirm --onedir --console --name golf_simulator_launcher \
            --add-data "*.png:." --add-data "launcher.*.example.json:." launcher.py
          cp README.md LICENSE CHANGELOG.md dist/golf_simulator_launcher/

      - name: Smoke test
        run: packaging/smoke-test.sh dist/golf_simulator_launcher/golf_simulator_launcher

      - name: Package
        run: tar -czf "golf_simulator_launcher-${{ matrix.platform }}.tar.gz" -C dist golf_simulator_launcher

      - uses: actions/upload-artifact@v7
        with:
          name: golf_simulator_launcher-${{ matrix.platform }}
          path: golf_simulator_launcher-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: golf_simulator_launcher-*
          merge-multiple: true
          path: release

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .changes/${{ github.ref_name }}.md
          files: release/golf_simulator_launcher-*.tar.gz
          fail_on_unmatched_files: true

  formula:
    # Write the Homebrew formula for this release (archives and their checksums).
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: golf_simulator_launcher-*
          merge-multiple: true
          path: release

      - name: Write the formula
        run: |
          python3 packaging/homebrew/formula.py --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" \
            --dist release --repo "$GITHUB_REPOSITORY" --out golf_simulator_launcher.rb
          cat golf_simulator_launcher.rb

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: golf_simulator_launcher.rb

  verify-formula:
    # Homebrew rewrites binaries as it installs them, which can break a bundled app,
    # so install from the release for real before anyone else can get the formula.
    name: verify-formula (${{ matrix.os }})
    needs: formula
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Install the libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3

      - name: Install with Homebrew
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git local/verify
          cp golf_simulator_launcher.rb "$(brew --repository local/verify)/Formula/"
          brew install --formula local/verify/golf_simulator_launcher
          brew test local/verify/golf_simulator_launcher
          packaging/smoke-test.sh "$(brew --prefix)/bin/golf_simulator_launcher"

  homebrew:
    # Push the verified formula to the tap, so `brew upgrade` gets the new version.
    # Needs a HOMEBREW_TAP_TOKEN secret that can push to the tap repo; without one
    # the formula is only saved as a workflow artifact.
    needs: verify-formula
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TAP: ${{ vars.HOMEBREW_TAP || 'moexx399/homebrew-tap' }}
      TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula

      - name: Push to the tap
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so $TAP wasn't updated. The formula is attached to this run as 'homebrew-formula'."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp golf_simulator_launcher.rb tap/Formula/golf_simulator_launcher.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/golf_simulator_launcher.rb
          if git diff --cached --quiet; then echo "formula already up to date"; exit 0; fi
          git commit -m "golf_simulator_launcher ${GITHUB_REF_NAME#v}"
          git push
